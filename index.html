<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería Interactiva</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos para los botones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>Mi Galería en la Nube</h1>
        <p>Sube, comparte y da likes a tus fotos favoritas</p>
    </header>

    <!-- Panel de subida -->
    <section class="upload-panel">
        <h2>Subir Nueva Imagen</h2>
        <form id="uploadForm">
            <div class="form-group">
                <label for="cloudName">Cloud Name de Cloudinary:</label>
                <input type="text" id="cloudName" placeholder="tu-cloud-name" required>
            </div>
            <div class="form-group">
                <label for="uploadPreset">Upload Preset (Unsigned):</label>
                <input type="text" id="uploadPreset" placeholder="nombre-del-preset" required>
            </div>
            <div class="form-group">
                <label for="imageFile">Selecciona la imagen:</label>
                <input type="file" id="imageFile" accept="image/*" required>
            </div>
            <button type="submit" id="submitBtn">Subir a Cloudinary</button>
        </form>
        <p id="statusMessage"></p>
    </section>

    <!-- Galería -->
    <main class="gallery-container" id="galleryContainer">
        <!-- Las imágenes se cargarán aquí dinámicamente -->
    </main>

    <footer>
        <p>&copy; 2026 - Galería Interactiva</p>
    </footer>

    <!-- Script de Supabase para manejar la base de datos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
